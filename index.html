<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="titre">Classement</h1>
      <p id="description"></p>
      <button id="ouvrir-popup" type="button" class="bouton" hidden>Je veux participer</button>
    </header>

    <section id="podium" aria-label="Podium"></section>
    <div id="entete-liste" class="entete-liste"></div>
    <ol id="liste" aria-label="Classement complet"></ol>

    <p id="erreur" hidden></p>
  </main>

  <dialog id="popup" aria-label="Détails de la participation">
    <button id="fermer-popup" type="button" class="fermer" aria-label="Fermer">×</button>
    <div id="popup-contenu" class="popup-corps"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
