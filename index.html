<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="bandeau">
    <div class="bandeau-piste" aria-hidden="true">
      <span>Qui sera le prochain sur le podium ?</span><span>✦</span>
      <span>Viens tester tes quadris</span><span>✦</span>
      <span>Qui sera le prochain sur le podium ?</span><span>✦</span>
      <span>Viens tester tes quadris</span><span>✦</span>
      <span>Qui sera le prochain sur le podium ?</span><span>✦</span>
      <span>Viens tester tes quadris</span><span>✦</span>
      <span>Qui sera le prochain sur le podium ?</span><span>✦</span>
      <span>Viens tester tes quadris</span><span>✦</span>
    </div>
    <button id="pause-bandeau" type="button" class="pause" aria-label="Mettre le bandeau en pause" aria-pressed="false">❚❚</button>
  </div>

  <main>
    <header class="hero">
      <h1 id="titre">Classement</h1>
      <p id="description"></p>
      <button id="ouvrir-popup" type="button" class="bouton" hidden>👉 Je veux participer 💪</button>
      <span class="sticker" aria-hidden="true">🍫<br>chocobons<br>offerts</span>
    </header>

    <section id="podium" aria-label="Podium"></section>

    <div class="tableau">
      <div id="entete-liste" class="entete-liste"></div>
      <ol id="liste" aria-label="Classement complet"></ol>
    </div>

    <p id="erreur" hidden></p>
  </main>

  <dialog id="popup" aria-label="Détails de la participation">
    <button id="fermer-popup" type="button" class="fermer" aria-label="Fermer">×</button>
    <div id="popup-contenu" class="popup-corps"></div>
  </dialog>

  <script src="script.js?v=5"></script>
</body>
</html>
